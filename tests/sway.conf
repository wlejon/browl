# The private headless sway the test_sway_* tests run against
# (run-headless-sway.sh): one small headless output, nothing else running.
xwayland disable
output * resolution 640x480
# A valid xdg-activation token focuses its window (sway's default only
# marks it urgent); test_sway_window checks activation by the focus moving.
focus_on_window_activation focus
